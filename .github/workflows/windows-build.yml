name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to publish, such as v1.3.0 (leave blank for build only)
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows installer
        run: pnpm run dist:win

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: MAZEN-Viewer-Windows-Installer
          path: dist/MAZEN-Viewer-Setup-*.exe
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source for GitHub CLI
        uses: actions/checkout@v4

      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: MAZEN-Viewer-Windows-Installer
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/MAZEN-Viewer-Setup-*.exe --repo "$GITHUB_REPOSITORY" --verify-tag --title "MAZEN Viewer $RELEASE_TAG" --generate-notes
